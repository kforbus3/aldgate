# The collector's own logs, forwarded into itself.
#
# Installed by `make enroll-self`. The collector was the one host missing from its
# own index, which is precisely the host you want when the collector is the thing
# misbehaving.
#
# This mirrors what ansible/enroll-syslog.yml writes for the fleet, with the
# service-account rules left out (nothing probes this box) and the target set to
# loopback. Change both together.
#
# No `#` comments inside an expression: rsyslog rejects that and then cannot
# interpret the master config at all, which takes the host silently deaf.
$WorkDirectory /var/spool/rsyslog

set $.aldgate_noise = 0;

if ($programname startswith "systemd" or $programname == "(systemd)") and not ($syslogseverity <= 4)
   and ($msg contains ".socket" or $msg contains ".slice" or $msg contains ".scope"
        or $msg contains "exit.target" or $msg contains "shutdown.target"
        or $msg contains "User Runtime Directory" or $msg contains "User Manager for UID"
        or $msg contains "gpg-agent" or $msg contains "dbus.service") then
  set $.aldgate_noise = 1;

if ($programname == "systemd-logind") and not ($syslogseverity <= 4)
   and ($msg contains "Removed session ") then
  set $.aldgate_noise = 1;

if not ($syslogseverity <= 4) and ($msg contains "pam_unix(cron:session)") then
  set $.aldgate_noise = 1;

if $.aldgate_noise == 0 then {
  action(type="omfwd" target="127.0.0.1" port="514" protocol="tcp"
         template="RSYSLOG_SyslogProtocol23Format"
         queue.type="LinkedList" queue.filename="aldgate-self"
         queue.maxdiskspace="128m" queue.saveonshutdown="on"
         action.resumeRetryCount="-1")
}
