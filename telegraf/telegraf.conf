# Telegraf: receive SNMP traps, and optionally poll devices.
#
# Vector handles syslog and cannot do SNMP; Telegraf can do both halves of SNMP
# (traps in, polling out) and writes to the same OpenSearch. Two agents rather
# than one is the honest split -- the alternative is snmptrapd shelling out to
# logger, which turns structured trap variables back into a text blob and loses
# exactly the fields worth searching.

[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 100000
  collection_jitter = "5s"
  flush_interval = "15s"
  flush_jitter = "5s"
  hostname = "aldgate"
  omit_hostname = false

# --- RECEIVE: SNMP traps ------------------------------------------------------
# Switches and routers send here when something happens: a link drops, a PSU
# fails, a config is written. Port 162 is the port they already know.
[[inputs.snmp_trap]]
  service_address = "udp://:162"
  # Translating an OID into a name needs MIBs. Without them a trap arrives as
  # 1.3.6.1.6.3.1.1.5.3, which is unsearchable by a human -- so the image's
  # bundled MIB set is pointed at explicitly rather than left to chance.
  path = ["/usr/share/snmp/mibs"]
  [inputs.snmp_trap.tags]
    log_type = "snmp_trap"

# --- OPTIONAL: SNMP polling ---------------------------------------------------
# Traps tell you when something breaks. Polling tells you what normal looked
# like beforehand, which is what makes a trap interpretable. Uncomment and set
# your community string to enable it for the MikroTik gear.
#
# [[inputs.snmp]]
#   agents = ["udp://10.10.0.111:161", "udp://10.10.0.5:161"]
#   version = 2
#   community = "public"
#   timeout = "5s"
#   retries = 1
#   [inputs.snmp.tags]
#     log_type = "snmp_poll"
#   [[inputs.snmp.field]]
#     name = "sysName"
#     oid  = "RFC1213-MIB::sysName.0"
#     is_tag = true
#   [[inputs.snmp.field]]
#     name = "uptime"
#     oid  = "RFC1213-MIB::sysUpTime.0"
#   [[inputs.snmp.table]]
#     name = "interface"
#     inherit_tags = ["sysName"]
#     oid = "IF-MIB::ifTable"
#     [[inputs.snmp.table.field]]
#       name = "ifDescr"
#       oid = "IF-MIB::ifDescr"
#       is_tag = true

# --- WRITE: OpenSearch --------------------------------------------------------
# outputs.opensearch, NOT outputs.elasticsearch. The elasticsearch output
# inspects the reported version and refuses OpenSearch outright -- "elasticsearch
# version not supported: 2.19.6", because it reads 2.x as Elasticsearch 2, which
# is a decade old. Telegraf ships a dedicated OpenSearch output for exactly this.
[[outputs.opensearch]]
  urls = ["http://opensearch:9200"]
  timeout = "10s"
  username = "admin"
  password = "${ALDGATE_ADMIN_PASSWORD}"
  # Daily indices matching the syslog stream, so one retention policy covers
  # both and a day of data is one thing to drop.
  # Go template, not strftime. The opensearch output does not expand %Y/%m/%d --
  # it passes them through, and OpenSearch then rejects the name because %Y is
  # uppercase ("Invalid index name [snmp-%Y.%m.%d], must be lowercase"). The
  # format string is Go's reference date.
  index_name = 'snmp-{{.Time.Format "2006.01.02"}}'
  # Templates come from bootstrap/bootstrap.sh so that both streams are
  # described in one place rather than half here and half there. template_name
  # is still required even with management off -- the plugin refuses to
  # initialise without it ("template_name configuration not defined").
  manage_template = false
  template_name = "aldgate-snmp"
  health_check_interval = "30s"
