# Telegraf: receive SNMP traps, and optionally poll devices.
#
# Vector handles syslog and cannot do SNMP; Telegraf can do both halves of SNMP
# (traps in, polling out). Two agents rather than one is the honest split -- the
# alternative is snmptrapd shelling out to logger, which turns structured trap
# variables back into a text blob and loses exactly the fields worth searching.
#
# The two halves go to different places on purpose, because they are different
# kinds of thing. A TRAP is an event -- something happened, once, and it belongs
# in the log stream next to the syslog line that probably accompanied it -- so it
# is posted to Vector and normalised into the same fields as everything else. A
# POLL is a metric: a number sampled on a schedule, with no message and no
# severity, useful as a time series and nonsense as a log line. That goes
# straight to its own index.

[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 100000
  collection_jitter = "5s"
  flush_interval = "15s"
  flush_jitter = "5s"
  hostname = "aldgate"
  omit_hostname = false

# --- RECEIVE: SNMP traps ------------------------------------------------------
# Switches and routers send here when something happens: a link drops, a PSU
# fails, a config is written. Port 162 is the port they already know.
[[inputs.snmp_trap]]
  service_address = "udp://:162"
  # Translating an OID into a name needs MIBs. Without them a trap arrives as
  # 1.3.6.1.6.3.1.1.5.3, which is unsearchable by a human -- so the image's
  # bundled MIB set is pointed at explicitly rather than left to chance.
  path = ["/usr/share/snmp/mibs"]
  [inputs.snmp_trap.tags]
    log_type = "snmp_trap"

# --- HAND TRAPS TO VECTOR -----------------------------------------------------
# Not written to OpenSearch directly, and this is the whole point. Telegraf's
# OpenSearch output nests every field under the measurement name and every tag
# under `tag.`, so a trap lands as snmp_trap.ifIndex / tag.source while a syslog
# line is a flat host / program / severity / message. Two schemas in one UI mean
# filtering by host shows you half your network and never says so. Posting to
# Vector puts both streams through one normaliser, so a trap is searchable with
# the same fields, the same severity scale and the same host names as a log line.
[[outputs.http]]
  url = "http://vector:8180/telegraf"
  method = "POST"
  data_format = "json"
  timeout = "10s"
  # One trap per request, NOT a {"metrics":[...]} envelope. Traps are rare by
  # nature -- a link flap, a reboot, a PSU -- so there is nothing to gain by
  # batching them, and the envelope costs a whole extra unwrapping step on the
  # far side that is silent when it goes wrong: the first version of this posted
  # batches, the unwrap failed, and what landed in OpenSearch was a
  # well-formed document with every field empty.
  use_batch_format = false
  # Traps only. If polling is enabled below, its metrics take the OpenSearch
  # route instead -- see the header.
  [outputs.http.tagpass]
    log_type = ["snmp_trap"]

# --- OPTIONAL: SNMP polling ---------------------------------------------------
# Traps tell you when something breaks. Polling tells you what normal looked
# like beforehand, which is what makes a trap interpretable. Uncomment and set
# your community string to enable it for the MikroTik gear.
#
# [[inputs.snmp]]
#   agents = ["udp://10.10.0.111:161", "udp://10.10.0.5:161"]
#   version = 2
#   community = "public"
#   timeout = "5s"
#   retries = 1
#   [inputs.snmp.tags]
#     log_type = "snmp_poll"
#   [[inputs.snmp.field]]
#     name = "sysName"
#     oid  = "RFC1213-MIB::sysName.0"
#     is_tag = true
#   [[inputs.snmp.field]]
#     name = "uptime"
#     oid  = "RFC1213-MIB::sysUpTime.0"
#   [[inputs.snmp.table]]
#     name = "interface"
#     inherit_tags = ["sysName"]
#     oid = "IF-MIB::ifTable"
#     [[inputs.snmp.table.field]]
#       name = "ifDescr"
#       oid = "IF-MIB::ifDescr"
#       is_tag = true

# --- WRITE: OpenSearch --------------------------------------------------------
# outputs.opensearch, NOT outputs.elasticsearch. The elasticsearch output
# inspects the reported version and refuses OpenSearch outright -- "elasticsearch
# version not supported: 2.19.6", because it reads 2.x as Elasticsearch 2, which
# is a decade old. Telegraf ships a dedicated OpenSearch output for exactly this.
[[outputs.opensearch]]
  urls = ["http://opensearch:9200"]
  timeout = "10s"
  username = "admin"
  password = "${ALDGATE_ADMIN_PASSWORD}"
  # Daily indices matching the syslog stream, so one retention policy covers
  # both and a day of data is one thing to drop.
  # Go template, not strftime. The opensearch output does not expand %Y/%m/%d --
  # it passes them through, and OpenSearch then rejects the name because %Y is
  # uppercase ("Invalid index name [snmp-%Y.%m.%d], must be lowercase"). The
  # format string is Go's reference date.
  index_name = 'snmp-{{.Time.Format "2006.01.02"}}'
  # Templates come from bootstrap/bootstrap.sh so that both streams are
  # described in one place rather than half here and half there. template_name
  # is still required even with management off -- the plugin refuses to
  # initialise without it ("template_name configuration not defined").
  manage_template = false
  template_name = "aldgate-snmp"
  health_check_interval = "30s"
  # Polled metrics only; traps went to Vector. Without this the same trap would
  # be indexed twice in two different shapes, which is worse than either.
  # Last in the section deliberately: in TOML every key after a sub-table header
  # belongs to that sub-table, so putting this above `timeout` would quietly
  # reparse the whole output as tagdrop settings.
  [outputs.opensearch.tagdrop]
    log_type = ["snmp_trap"]
