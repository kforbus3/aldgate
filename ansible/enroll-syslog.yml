---
# Point a host's rsyslog at Aldgate.
#
# Run from Provenance (Automation -> Playbooks) against any group, or with
# ansible-playbook directly.
#
# Enrolling is a config file plus, on some hosts, one small package. I assumed
# every Debian host already ran rsyslog; the cloud-image VMs (k3s, identity,
# this collector) ship with journald ONLY -- no rsyslog, no /etc/rsyslog.d --
# so an earlier version of this playbook silently skipped exactly the hosts
# built most recently. It installs it now.
#
# rsyslog rather than systemd-journal-upload because journal-upload speaks a
# systemd-specific protocol to systemd-journal-remote, not syslog, and would
# mean a second receiver for a subset of hosts. One protocol, one receiver.
#
#   ansible-playbook -i <inventory> ansible/enroll-syslog.yml -e aldgate_host=10.10.0.177
#
# Idempotent: re-running changes nothing once the file matches.
- name: Enrol hosts into Aldgate log collection
  hosts: all
  become: true
  gather_facts: true
  vars:
    aldgate_host: "10.10.0.177"
    # The accounts Provenance itself logs in as. Their session churn is filtered
    # out of what gets FORWARDED (never out of the host's own logs) -- see the
    # forwarding rule below for why and for exactly what survives.
    aldgate_service_accounts: [prov, prov-login, fleet, fleet-login]
    # The addresses Provenance connects FROM: its host and its overlay. Used to
    # filter connection-teardown lines that are its own, while keeping the
    # identical lines from anywhere else -- on an internet-facing host
    # "Connection closed by <someone>" is a scan, and that is worth seeing.
    aldgate_control_plane_addresses: ["10.10.0.208", "10.100.0.1"]
    aldgate_port: 514
    # TCP by default. UDP loses messages silently under load and gives no
    # back-pressure, which is the wrong trade for an audit trail; @@ is TCP in
    # rsyslog's syntax, @ is UDP.
    aldgate_protocol: "@@"
    # Keep a local copy. A collector that becomes the only copy is a collector
    # whose outage is a blind spot.
    aldgate_keep_local: true

  tasks:
    - name: Is rsyslog already installed?
      ansible.builtin.stat:
        path: /etc/rsyslog.conf
      register: rsyslog_conf

    - name: Install rsyslog where the host has only journald
      ansible.builtin.package:
        name: rsyslog
        state: present
      when: not rsyslog_conf.stat.exists
      register: rsyslog_installed

    - name: Re-check after installing
      ansible.builtin.stat:
        path: /etc/rsyslog.conf
      register: rsyslog_conf
      when: rsyslog_installed is changed

    - name: Forward the journal into syslog
      # journald keeps its own store and only feeds rsyslog when told to. Without
      # this, a freshly installed rsyslog forwards almost nothing and the host
      # looks enrolled while sending nothing worth reading.
      ansible.builtin.lineinfile:
        path: /etc/systemd/journald.conf
        regexp: '^#?ForwardToSyslog='
        line: 'ForwardToSyslog=yes'
        state: present
      notify: Restart journald

    - name: Look up the service accounts' UIDs
      # systemd names its per-session units by UID -- user@1003.service,
      # run-user-1003.mount, user-1003.slice -- with no account name anywhere in
      # the message. Filtering those by text alone would drop a HUMAN's session
      # scaffolding too, so the numbers are looked up here, per host, because the
      # same account has different UIDs on different machines.
      ansible.builtin.shell: |
        for a in {{ aldgate_service_accounts | join(' ') }}; do id -u "$a" 2>/dev/null || true; done
      register: aldgate_service_uids
      changed_when: false
      check_mode: false

    - name: Install the forwarding rule
      ansible.builtin.copy:
        dest: /etc/rsyslog.d/60-aldgate.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Aldgate (ansible/enroll-syslog.yml). Local edits are lost
          # on the next run.
          #
          # A disk-assisted queue so a collector outage or a reboot of it does
          # not lose this host's logs: rsyslog spools to /var/spool/rsyslog and
          # drains when Aldgate comes back. Without this, anything logged during
          # an outage is gone, and you find out when you go looking for it.
          # RFC5424, not the default RFC3164.
          #
          # RFC3164 sends "Sep 18 16:32:25" with NO timezone, so a collector in
          # UTC files a host in EDT four hours in the past -- every search by
          # time then misses that host, and a "last hour" view looks like the
          # host has stopped sending. RFC5424 carries an explicit offset.
          $WorkDirectory /var/spool/rsyslog

          # --- what NOT to send ------------------------------------------------
          #
          # Provenance probes every host every 30 seconds, and each probe is an SSH
          # login: a logind session, a per-user systemd instance starting and
          # exiting, a sudo, and the whole thing torn down again. Measured on this
          # fleet, that was over 90% of everything the collector received --
          # 21,748 `systemd` lines in ten minutes against ~1,500 for every real
          # event on every host combined. A log system whose own monitoring buries
          # the logs is not a log system.
          #
          # Filtered HERE, at the forward action only: the host's own
          # /var/log keeps every line, so nothing is destroyed and anything can be
          # read back on the machine itself.
          #
          # What is dropped is scaffolding, not evidence:
          #  * the per-user systemd instance's own unit chatter -- gpg-agent and
          #    ssh-agent sockets opening and closing, app.slice being created,
          #    exit.target, the user runtime directory. None of it says who did
          #    anything; it is the same lines whoever logs in.
          #  * session open/close for the SERVICE accounts only.
          #
          # What survives, deliberately:
          #  * every session for a HUMAN account, opened and closed
          #  * every authentication FAILURE, from anyone, including the service
          #    accounts -- a failing probe is exactly what you want to see
          #  * every sudo, including Provenance's: that records what was actually
          #    run as root, which is the part worth keeping
          #  * logind's New session / Removed session, which is the cleanest
          #    per-session record there is
          set $.aldgate_noise = 0;

          if ($programname startswith "systemd" or $programname == "(systemd)") and not ($syslogseverity <= 4) then {
            # Matched on the UNIT NAMES that only exist inside a user session,
            # rather than on verbs like "Stopped target". A system shutdown also
            # stops targets, and those lines are worth keeping; `sockets.target`
            # for a per-login user manager is not. fleet-wg-reresolve is
            # Provenance's own WireGuard re-resolver, which runs on a timer and says
            # the same three lines every time; a FAILURE of it is severity <= 4 and
            # still arrives.
            #
            # NOTE: no comments inside the expression below. rsyslog rejects `#`
            # within an expression -- "invalid character '#' in expression" -- and
            # then cannot interpret the master config at all, so the host silently
            # stops forwarding AND stops writing /var/log/syslog. That is what
            # happened when this list was extended without re-running
            # `rsyslogd -N1`: seventeen hosts went quiet at once.
            if ($msg contains "gpg-agent" or $msg contains "ssh-agent.socket"
                or $msg contains "keyboxd.socket" or $msg contains "dirmngr.socket"
                or $msg contains "dbus.socket"
                or $msg contains "app.slice" or $msg contains "exit.target"
                or $msg contains "systemd-exit.service"
                or $msg contains "basic.target" or $msg contains "default.target"
                or $msg contains "paths.target" or $msg contains "sockets.target"
                or $msg contains "timers.target" or $msg contains "shutdown.target"
                or $msg contains "User Runtime Directory"
                or $msg contains "User Manager for UID" or $msg contains "Queued start job"
                or $msg contains "wireplumber" or $msg contains "wg-reresolve") then
              set $.aldgate_noise = 1;
          }

          # Session open/close for the service accounts. Keyed on the account name
          # AND on it being a session message, so "authentication failure for prov"
          # is never matched.
          {% for acct in aldgate_service_accounts %}
          if ($programname startswith "sshd" or $programname == "su"
              or $programname == "systemd-logind" or $programname == "(systemd)"
              or $programname == "(sd-pam)")
             and not ($syslogseverity <= 4)
             and ($msg contains "session closed for user {{ acct }}"
                  or $msg contains "session opened for user {{ acct }}("
                  or $msg contains "Close session: user {{ acct }} ") then
            set $.aldgate_noise = 1;
          {% endfor %}

          # The per-session units the SYSTEM manager logs about, keyed on the
          # service accounts' own UIDs so a human's session is left alone.
          {% for uid in aldgate_service_uids.stdout_lines | map('trim') | select | list %}
          if ($programname == "systemd") and not ($syslogseverity <= 4)
             and ($msg contains "user@{{ uid }}.service"
                  or $msg contains "user-{{ uid }}.slice"
                  or $msg contains "run-user-{{ uid }}.mount"
                  or $msg contains "user-runtime-dir@{{ uid }}.service") then
            set $.aldgate_noise = 1;
          {% endfor %}

          # Desktop and audio session services. They exist to make a graphical
          # session work, they start and stop with every login, and they say
          # nothing about the machine's health. Warning or worse still arrives.
          if not ($syslogseverity <= 4) and ($programname == "rtkit-daemon"
              or $programname == "wireplumber" or $programname startswith "pipewire"
              or $programname == "mpris-proxy" or $programname == "gnome-keyring-daemon"
              or $programname == "speech-dispatcher" or $programname == "pulseaudio"
              or $programname == "systemd-xdg-autostart-generator"
              or $programname == "at-spi-bus-launcher") then
            set $.aldgate_noise = 1;

          # systemd's bookkeeping for per-session units -- sockets, slices and
          # scopes opening and closing. One line per unit per login, and on a host
          # with a desktop installed that is dozens of lines per probe.
          #
          # This does also drop socket-activation records at boot and container
          # scope lines, both at info level. Docker and containerd log their own
          # container lifecycle, boots are visible a dozen other ways, and
          # anything that FAILS is warning or worse and still arrives.
          if ($programname startswith "systemd") and not ($syslogseverity <= 4)
             and ($msg contains ".socket" or $msg contains ".slice"
                  or $msg contains ".scope" or $msg contains "pipewire"
                  or $msg contains "gnome-keyring" or $msg contains "speech-dispatcher"
                  or $msg contains "mpris-proxy" or $msg contains "filter-chain"
                  or $msg contains "pk-debconf-helper" or $msg contains "dbus.service"
                  or $msg contains "at-spi") then
            set $.aldgate_noise = 1;

          # logind's records for the service accounts, and the bare "Removed
          # session N" lines that name nobody at all. A human's session open and
          # close are still recorded by sshd's pam_unix lines, which are kept, so
          # nothing about a person's access is lost here.
          {% for acct in aldgate_service_accounts %}
          if ($programname == "systemd-logind") and not ($syslogseverity <= 4)
             and ($msg contains "of user {{ acct }}.") then
            set $.aldgate_noise = 1;
          {% endfor %}
          if ($programname == "systemd-logind") and not ($syslogseverity <= 4)
             and ($msg contains "Removed session ") then
            set $.aldgate_noise = 1;

          # cron's PAM session pairs. The job itself -- the CMD line naming what
          # ran -- is kept, because that is the part that answers a question.
          if not ($syslogseverity <= 4) and ($msg contains "pam_unix(cron:session)") then
            set $.aldgate_noise = 1;

          # sshd's connection teardown for the service accounts.
          {% for acct in aldgate_service_accounts %}
          if ($programname startswith "sshd") and not ($syslogseverity <= 4)
             and ($msg contains "Disconnected from user {{ acct }} "
                  or $msg contains "Starting session: command for {{ acct }} ") then
            set $.aldgate_noise = 1;
          {% endfor %}

          # sudo's PAM session pairs, when the caller is a service account. The
          # line that matters -- `prov : PWD=... COMMAND=...`, naming what actually
          # ran as root -- is kept; "session opened for user root by prov" adds
          # nothing to it and arrives twice per sudo.
          {% for acct in aldgate_service_accounts %}
          if not ($syslogseverity <= 4) and ($msg contains "pam_unix(sudo:session)")
             and ($msg contains "by {{ acct }}(") then
            set $.aldgate_noise = 1;
          {% endfor %}

          # The ONE place this drops a high-severity line, and deliberately.
          #
          # sshd logs `fatal: ssh_packet_send_debug: send DEBUG: Broken pipe` at
          # CRIT when a client vanishes mid-exchange, which is what the monitor's
          # probe does every 30 seconds after it has what it came for. Nothing is
          # wrong, but at crit it lands in every "critical" search and every alert
          # built on severity -- the effect of leaving it is that severity stops
          # meaning anything. Matched on the exact text, so a real fatal from sshd
          # still arrives.
          if ($programname startswith "sshd") and ($msg contains "ssh_packet_send_debug") then
            set $.aldgate_noise = 1;

          # Connection teardown from the control plane's own addresses. The same
          # line from any other address survives, because on a host reachable from
          # outside it is a scan and worth keeping.
          {% for addr in aldgate_control_plane_addresses %}
          if ($programname startswith "sshd") and not ($syslogseverity <= 4)
             and ($msg contains "Connection closed by {{ addr }} "
                  or $msg contains "Connection closed by authenticating user"
                  and $msg contains "{{ addr }}") then
            set $.aldgate_noise = 1;
          {% endfor %}

          # logind's teardown chatter, which names no account and says nothing a
          # person would act on. Session open and close are still recorded.
          if ($programname == "systemd-logind") and not ($syslogseverity <= 4)
             and ($msg contains "logged out. Waiting for processes") then
            set $.aldgate_noise = 1;

          # sshd's byte counter, which carries no information about who did what.
          # Outside the account loop because it names nobody to key on.
          #
          # `contains`, not `startswith`: rsyslog's $msg keeps the leading space
          # that separates it from the tag, so a startswith test against the first
          # word never matches and the rule silently does nothing. Two rules here
          # were written that way and were dead until a behaviour test caught one
          # of them arriving when it should not have.
          if ($programname startswith "sshd") and ($msg contains "Transferred: sent ") then
            set $.aldgate_noise = 1;

          if $.aldgate_noise == 0 then {
            action(type="omfwd"
                   target="{{ aldgate_host }}" port="{{ aldgate_port }}"
                   protocol="{{ 'tcp' if aldgate_protocol == '@@' else 'udp' }}"
                   # RFC5424, not the default RFC3164: RFC3164 carries no timezone,
                   # so a collector in UTC files an EDT host four hours in the past
                   # and it vanishes from every search by time.
                   template="RSYSLOG_SyslogProtocol23Format"
                   # A disk-assisted queue, so a collector outage or a reboot of it
                   # does not lose this host's logs: rsyslog spools and drains when
                   # Aldgate comes back.
                   queue.type="LinkedList"
                   queue.filename="aldgate"
                   queue.maxdiskspace="256m"
                   queue.saveonshutdown="on"
                   action.resumeRetryCount="-1")
          }
      notify: Restart rsyslog

    - name: Ensure the spool directory exists
      ansible.builtin.file:
        path: /var/spool/rsyslog
        state: directory
        owner: root
        group: root
        mode: "0700"

  handlers:
    - name: Restart journald
      ansible.builtin.service:
        name: systemd-journald
        state: restarted

    - name: Restart rsyslog
      ansible.builtin.service:
        name: rsyslog
        state: restarted
        enabled: true
